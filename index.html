<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Заучивание слов</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#17302b;--mute:#5d7570;--line:#d3dedb;--acc:#0f766e;--accInk:#fff;--ok:#15803d;--bad:#b91c1c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b19;--card:#172724;--ink:#e6f0ed;--mute:#97b0aa;--line:#2c443f;--acc:#2dd4bf;--accInk:#06201c;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b19;--card:#172724;--ink:#e6f0ed;--mute:#97b0aa;--line:#2c443f;--acc:#2dd4bf;--accInk:#06201c;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 14px}
h2{font-size:1.05rem;margin:0 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;padding:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:10px}
input{width:100%;padding:13px;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:var(--acc);color:var(--accInk);font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.q{font-size:2rem;font-weight:700;text-align:center;margin:10px 0 4px;word-break:break-word}
.dir{text-align:center;color:var(--mute);font-size:.9rem;margin-bottom:14px}
.msg{min-height:1.5em;margin-top:12px;text-align:center;font-weight:600}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.score{text-align:center;color:var(--mute);font-size:.9rem;margin-top:10px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li span{flex:1;word-break:break-word}
li b{color:var(--acc)}
li button{border:0;background:none;color:var(--bad);font-size:1.2rem;cursor:pointer;padding:4px 8px}
.empty{color:var(--mute);text-align:center;padding:10px}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Заучивание слов</h1>
<div class="tabs" role="tablist">
<button role="tab" id="t1" aria-selected="true">Тренировка</button>
<button role="tab" id="t2" aria-selected="false">Мои слова (<span id="cnt">0</span>)</button>
</div>

<section id="train">
<div class="card">
<div id="empty" class="empty hidden">Пока нет слов. Добавьте их во вкладке «Мои слова».</div>
<div id="quiz" class="hidden">
<div class="dir" id="dir"></div>
<div class="q" id="q"></div>
<input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ваш ответ">
<button class="btn" id="check">Проверить</button>
<div class="msg" id="msg" aria-live="polite"></div>
<div class="score" id="score"></div>
</div>
</div>
</section>

<section id="words" class="hidden">
<div class="card">
<h2>Добавить слово</h2>
<div class="row">
<input id="w1" autocomplete="off" placeholder="Слово (hello)">
<input id="w2" autocomplete="off" placeholder="Перевод (привет)">
</div>
<button class="btn" id="add">Добавить</button>
</div>
<div class="card">
<ul id="list"></ul>
</div>
</section>
</main>

<script>
(function(){
var KEY="slova_v1", words=[], cur=null, answered=false, ok=0, total=0;
var $=function(id){return document.getElementById(id)};

function load(){try{var s=localStorage.getItem(KEY);if(s){var a=JSON.parse(s);if(Array.isArray(a))words=a}}catch(e){words=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(words))}catch(e){}}
function norm(s){return s.trim().toLowerCase().replace(/ё/g,"е").replace(/\s+/g," ")}

function renderList(){
  $("cnt").textContent=words.length;
  var ul=$("list");ul.innerHTML="";
  if(!words.length){ul.innerHTML='<li class="empty">Список пуст</li>';return}
  words.forEach(function(w,i){
    var li=document.createElement("li");
    var sp=document.createElement("span");
    var b=document.createElement("b");b.textContent=w.a;
    sp.appendChild(b);sp.appendChild(document.createTextNode(" — "+w.b));
    var del=document.createElement("button");del.textContent="×";del.setAttribute("aria-label","Удалить");
    del.onclick=function(){words.splice(i,1);save();renderList();next()};
    li.appendChild(sp);li.appendChild(del);ul.appendChild(li);
  });
}

function next(){
  $("msg").textContent="";$("msg").className="msg";$("ans").value="";answered=false;$("check").textContent="Проверить";
  if(!words.length){$("empty").classList.remove("hidden");$("quiz").classList.add("hidden");cur=null;return}
  $("empty").classList.add("hidden");$("quiz").classList.remove("hidden");
  var w,tries=0;
  do{w=words[Math.floor(Math.random()*words.length)];tries++}while(cur&&words.length>1&&w===cur.w&&tries<20);
  var rev=Math.random()<.5;
  cur={w:w,show:rev?w.b:w.a,want:rev?w.a:w.b};
  $("q").textContent=cur.show;
  $("dir").textContent=rev?"Напишите слово на языке оригинала":"Напишите перевод";
  $("ans").focus();
}

function check(){
  if(!cur)return;
  if(answered){next();return}
  var v=norm($("ans").value);if(!v)return;
  var variants=cur.want.split(/[,;\/]/).map(norm).concat([norm(cur.want)]);
  total++;
  var m=$("msg");
  if(variants.indexOf(v)>-1){ok++;m.textContent="Верно!";m.className="msg ok";answered=true;$("check").textContent="Дальше";setTimeout(function(){if(answered&&cur)next()},900)}
  else{m.textContent="Неверно. Правильно: "+cur.want;m.className="msg bad";answered=true;$("check").textContent="Дальше"}
  $("score").textContent="Верно: "+ok+" из "+total;
}

function add(){
  var a=$("w1").value.trim(),b=$("w2").value.trim();
  if(!a||!b){(a?$("w2"):$("w1")).focus();return}
  words.push({a:a,b:b});save();renderList();
  $("w1").value="";$("w2").value="";$("w1").focus();
}

function tab(n){
  $("train").classList.toggle("hidden",n!==1);$("words").classList.toggle("hidden",n!==2);
  $("t1").setAttribute("aria-selected",n===1);$("t2").setAttribute("aria-selected",n===2);
  if(n===1)next();
}

$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};
$("check").onclick=check;$("add").onclick=add;
$("ans").addEventListener("keydown",function(e){if(e.key==="Enter")check()});
$("w1").addEventListener("keydown",function(e){if(e.key==="Enter")$("w2").focus()});
$("w2").addEventListener("keydown",function(e){if(e.key==="Enter")add()});

load();renderList();next();
})();
</script>
</body>
</html>
